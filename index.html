<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DBD Builds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>


<main id="app"></main>
<div id="overlay" class="overlay" hidden></div>

<footer class="site-foot">
  Fan-made build planner · Not affiliated with Behaviour Interactive
</footer>

<dialog id="picker" aria-labelledby="picker-title">
  <div class="picker-head">
    <h2 id="picker-title">Choose</h2>
    <button class="close-btn" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="picker-search">
    <input type="search" id="picker-q" placeholder="Search…" autocomplete="off">
  </div>
  <div class="picker-list" id="picker-list"></div>
  <div class="picker-detail" id="picker-detail"></div>
</dialog>

<div id="tip" class="tip" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="js/data.js"></script>
<script src="js/rules-1v1.js"></script>
<script src="js/app.js"></script>
</body>
</html>
